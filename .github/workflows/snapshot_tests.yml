name: Snapshot tests
on:
  pull_request

env:
  # renovate: datasource=rust-version depName=rust
  RUST_VERSION: 1.97.1
  ZOLA_VERSION: 1969d846a7ca7536dc547da500bcf9be9c631f40 # v0.23.6

jobs:
  snapshot-tests:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.body, 'RUN_SNAPSHOT_TESTS')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup override set ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: CARGO RUST ZOLA_VERSION
      - name: Install Zola
        run: cargo install --locked --git https://github.com/getzola/zola --rev ${{ env.ZOLA_VERSION }} --debug

      - run: git fetch --depth 2
      - run: git checkout origin/main
      - name: Generate good snapshots
        run: INSTA_OUTPUT=none INSTA_UPDATE=always cargo test -p snapshot -- --include-ignored
      - run: git checkout $GITHUB_SHA # merge of main+branch
      - run: INSTA_OUTPUT=none INSTA_UPDATE=no cargo test -p snapshot -- --include-ignored
